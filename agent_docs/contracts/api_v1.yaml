openapi: 3.0.3
info:
  title: Football Predictions API
  version: 1.2.1
  description: >-
    Stage 1.2.1 — auth setup links (B11), supervisor training mode + contest restore (B12).
    Prior: discovery/contacts (1.8), leaderboard count_* (1.7), team logo (1.9).
    Primary prefix: /api/v1/contests/{contest_id}/...
    Legacy paths without contest_id are DEPRECATED shims (resolve default contest for loader regression).
    Auth via JWT (Bearer). Score fields integers [0, max_score_value]; MISSING prediction = absent row, never 0.
    CSV delimiter ';' (teams.csv ',' in loader). Timestamps TIMESTAMPTZ UTC ISO 8601.
    Phases: SETUP (DRAFT, !is_locked) vs RUNNING (after first activate). See contest_lifecycle_flow.md.
    Exceptional tie-break: contest_participants.exceptional_tiebreak_points (support (ADMIN), NOT rules_json; allowed when locked).
    Auto-close: sync hook on contest-scoped calls — ACTIVE→CLOSED when deadline passed (no BackgroundTasks).

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: user
  - name: contests
  - name: contest setup
  - name: predictions
  - name: rounds (public)
  - name: admin (supervisor)
  - name: admin (contest)
  - name: support (system)
  - name: support (platform)
  - name: legacy (deprecated)

paths:
  # ─── Auth (global) ───
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login, returns JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordSetupRequired' }

  /api/v1/auth/setup-preview:
    get:
      tags: [auth]
      summary: Preview invite/reset link (login, UI mode, completion state)
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/complete-setup:
    post:
      tags: [auth]
      summary: Accept invite and/or set password via signed token (idempotent)
      description: >-
        Token payload: { sub, contest_id?, purpose: setup_password, exp }.
        When contest_id present and participant PENDING → ACCEPTED.
        new_password required when enforce_password_setup=true (password_form mode).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteSetupRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompleteSetupResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/request-password-reset:
    post:
      tags: [auth]
      summary: Request password reset by email (always 200 for privacy)
      description: >-
        When email is known: new temp password + signed setup token issued (no SMTP in v1).
        Same triple as invite: login + temp_password + setup_url (returned only in dev/logs).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change password (mandatory on first login)
      description: >-
        Clears is_temp_password and flips all PENDING contest_participants rows
        for the user to ACCEPTED.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me/contacts:
    get:
      tags: [auth]
      summary: Current user contact profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Partial update of contact profile (upsert)
      description: Allowed while is_temp_password=true.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactOut' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/contests:
    get:
      tags: [user]
      summary: Contests the current user is enrolled in
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserContestOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─── Contests ───
  /api/v1/contests:
    get:
      tags: [contests]
      summary: List contests (SUPERVISOR+)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContestOut' }
    post:
      tags: [contests]
      summary: Create contest in DRAFT (SETUP phase)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContestRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestOut' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/contests/public:
    get:
      tags: [contests]
      summary: Public list of RUNNING contests (no auth)
      description: >-
        Must be registered before /contests/{contest_id} to avoid path capture.
        Returns only contests with status RUNNING.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicContestOut' }

  /api/v1/contests/{contest_id}:
    get:
      tags: [contests]
      summary: Get contest by id
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestOut' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [contests]
      summary: Update contest settings (forbidden when is_locked)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestOut' }
        '403': { $ref: '#/components/responses/ContestLocked' }
    delete:
      tags: [admin (contest)]
      summary: Safe delete one contest (PAUSED + grace + confirm)
      description: >-
        RBAC: Support (ADMIN) always; SUPERVISOR when supervisor_training_mode=true.
        Instant delete (skip grace) when contest_allow_instant_delete or supervisor_training_mode.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestDeleteConfirmRequest' }
      responses:
        '200': { description: Contest wiped }
        '400': { $ref: '#/components/responses/GracePeriodActive' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/contests/{contest_id}/pause:
    post:
      tags: [admin (contest)]
      summary: Pause contest (RUNNING -> PAUSED)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestLifecycleOut' }

  /api/v1/contests/{contest_id}/resume:
    post:
      tags: [admin (contest)]
      summary: Resume contest (PAUSED -> RUNNING)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestLifecycleOut' }

  /api/v1/contests/{contest_id}/finish:
    post:
      tags: [admin (contest)]
      summary: Early finish (RUNNING|PAUSED -> FINISHED)
      description: >-
        RBAC: Support (ADMIN) always; SUPERVISOR when supervisor_training_mode=true.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestLifecycleOut' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/contests/{contest_id}/restore:
    post:
      tags: [admin (contest)]
      summary: Restore contest from training-mode snapshot (within restore window)
      description: >-
        Available only when supervisor_training_mode=true (SUPERVISOR + Support (ADMIN)).
        After DELETE wipe: replays snapshot (teams, rounds, matches, participants).
        Snapshot consumed on success; 404/410 when missing or expired.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestRestoreResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No snapshot for contest }
        '410': { description: Snapshot expired (contest_restore_window_seconds) }

  # ─── Setup: teams ───
  /api/v1/contests/{contest_id}/teams:
    get:
      tags: [contest setup]
      summary: List teams in contest
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamOut' }
    post:
      tags: [contest setup]
      summary: Create team (SETUP only, !is_locked)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamOut' }
        '403': { $ref: '#/components/responses/ContestLocked' }

  /api/v1/contests/{contest_id}/teams/{team_id}/logo:
    post:
      tags: [contest setup]
      summary: Upload team logo (SETUP only, PNG/JPEG/GIF, max 2 MiB)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: team_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoUploadResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ContestLocked' }

  /api/v1/contests/{contest_id}/teams/{team_id}:
    patch:
      tags: [contest setup]
      summary: Update team (SETUP only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: team_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamPatchRequest' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/ContestLocked' }
    delete:
      tags: [contest setup]
      summary: Delete team (SETUP only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: team_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/ContestLocked' }

  # ─── Setup: participants ───
  /api/v1/contests/{contest_id}/participants:
    get:
      tags: [contest setup]
      summary: List contest participants
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParticipantOut' }
    post:
      tags: [contest setup]
      summary: Add participant + invite (temp password returned; no email send in 1.4)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantCreateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantInviteOut' }
        '403': { $ref: '#/components/responses/ContestLocked' }

  /api/v1/contests/{contest_id}/participants/{user_id}:
    delete:
      tags: [contest setup]
      summary: Remove participant from contest (SETUP only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Removed }
        '403': { $ref: '#/components/responses/ContestLocked' }

  /api/v1/contests/{contest_id}/participants/{user_id}/exceptional-tiebreak:
    put:
      tags: [admin (contest)]
      summary: Set exceptional tie-break points for participant (allowed when is_locked)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExceptionalTiebreakRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  contest_id: { type: integer }
                  user_id: { type: integer }
                  exceptional_tiebreak_points: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─── Public / user (contest-scoped) ───
  /api/v1/contests/{contest_id}/rounds:
    get:
      tags: [rounds (public)]
      summary: List rounds in contest
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoundOut' }

  /api/v1/contests/{contest_id}/rounds/{id}/predictions:
    get:
      tags: [predictions]
      summary: Get predictions for round (pre-deadline privacy)
      description: >-
        Optional Bearer. Before deadline: anonymous callers receive 403
        (code PREDICTIONS_NOT_PUBLIC). Authenticated USER and SUPERVISOR see only own scores;
        others show submitted-only. Support (ADMIN) sees all (troubleshooting). After deadline: full table
        for everyone including anonymous callers.
      security: []
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundPredictionsView' }
        '403':
          description: Pre-deadline anonymous access denied (PREDICTIONS_NOT_PUBLIC)
    post:
      tags: [predictions]
      summary: Submit predictions (batch-only, RUNNING + ACTIVE + before deadline)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PredictionBatchRequest' }
      responses:
        '200': { description: Saved }
        '400': { description: Partial batch rejected }
        '403': { description: Deadline passed / not ACTIVE / contest not RUNNING }

  /api/v1/contests/{contest_id}/rounds/{id}/leaderboard:
    get:
      tags: [rounds (public)]
      summary: Per-round leaderboard
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: scope
          in: query
          schema: { type: string, enum: [round, total], default: round }
          description: >
            round — scores for this tour only (supervisor preview default).
            total — cumulative standings through selected round number (public LB tab).
      responses:
        '200':
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }

  /api/v1/contests/{contest_id}/rounds/{id}/results:
    get:
      tags: [rounds (public)]
      summary: Per-round results (CALCULATED/PUBLISHED)
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundResults' }

  /api/v1/contests/{contest_id}/leaderboard:
    get:
      tags: [rounds (public)]
      summary: Global aggregated leaderboard for contest
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200':
          headers:
            Cache-Control: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }

  # ─── Admin operational (contest-scoped) ───
  /api/v1/contests/{contest_id}/admin/rounds:
    post:
      tags: [admin (supervisor)]
      summary: Create round with matches (existing teams only when locked)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoundRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id: { type: integer }
                  status: { type: string, enum: [DRAFT, ACTIVE] }

  /api/v1/contests/{contest_id}/admin/rounds/free-tour:
    post:
      tags: [admin (supervisor)]
      summary: Create Free Tour from POSTPONED matches (scenario 7)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreeTourRequest' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id: { type: integer }
                  round_number: { type: integer }
        '400': { description: Invalid match status or contest phase }

  /api/v1/contests/{contest_id}/admin/rounds/{id}:
    patch:
      tags: [admin (supervisor)]
      summary: Edit ACTIVE round before deadline
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoundRequest' }
      responses:
        '200': { description: Updated }

  /api/v1/contests/{contest_id}/admin/rounds/{id}/activate:
    post:
      tags: [admin (supervisor)]
      summary: Activate round; first activation locks contest and sets RUNNING
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Activated }

  /api/v1/contests/{contest_id}/admin/rounds/{id}/close:
    post:
      tags: [admin (supervisor)]
      summary: Close round ACTIVE -> CLOSED (requires now >= deadline; auto-close also applies)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id: { type: integer }
                  status: { type: string, enum: [CLOSED] }
        '400': { description: Deadline not yet passed }

  /api/v1/contests/{contest_id}/admin/rounds/{id}/calculate:
    post:
      tags: [admin (supervisor)]
      summary: Calculate round (requires CLOSED)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id: { type: integer }
                  status: { type: string, enum: [CALCULATED] }
                  users_scored: { type: integer }

  /api/v1/contests/{contest_id}/admin/rounds/{id}/publish:
    post:
      tags: [admin (supervisor)]
      summary: Publish round (CALCULATED -> PUBLISHED)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Published }

  /api/v1/contests/{contest_id}/admin/matches/{id}/result:
    put:
      tags: [admin (supervisor)]
      summary: Apply match result (only after round deadline and round CLOSED)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchResultRequest' }
      responses:
        '200': { description: Result applied }
        '403': { description: Before deadline or round not CLOSED }

  /api/v1/contests/{contest_id}/admin/matches/{id}/status:
    patch:
      tags: [admin (supervisor)]
      summary: Change match status (VOID/POSTPONED/CANCELED)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/contest_id' }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [VOID, POSTPONED, CANCELED] }
      responses:
        '200': { description: OK }

  /api/v1/contests/{contest_id}/admin/recalculate:
    post:
      tags: [support (system)]
      summary: Support full contest recalculation (users.role=ADMIN)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/contest_id' }]
      responses:
        '200': { description: Recalculated }

  # ─── Legacy shims (deprecated — default contest resolution) ───
  /api/v1/rounds:
    get:
      tags: [legacy (deprecated)]
      deprecated: true
      summary: '[DEPRECATED] List rounds — use /contests/{contest_id}/rounds'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoundOut' }

  /api/v1/leaderboard:
    get:
      tags: [legacy (deprecated)]
      deprecated: true
      summary: '[DEPRECATED] Global leaderboard — use /contests/{contest_id}/leaderboard'
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leaderboard' }

  /api/v1/admin/contest-settings:
    get:
      tags: [legacy (deprecated)]
      deprecated: true
      summary: '[DEPRECATED] Maps to default contest GET'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestOut' }
    patch:
      tags: [legacy (deprecated)]
      deprecated: true
      summary: '[DEPRECATED] Maps to default contest PATCH'
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestPatchRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContestOut' }

  /api/v1/admin/users/supervisor:
    post:
      tags: [support (platform)]
      summary: Create contest organizer (SUPERVISOR role; Support (ADMIN) only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSupervisorRequest' }
      responses:
        '200':
          description: Organizer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSupervisorResponse' }
        '400': { description: Duplicate login or validation error }
        '403': { description: Not Support (ADMIN role) }

  /api/v1/admin/users/{user_id}/exceptional-tiebreak:
    put:
      tags: [legacy (deprecated)]
      deprecated: true
      summary: '[DEPRECATED] Use /contests/{contest_id}/participants/{user_id}/exceptional-tiebreak'
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExceptionalTiebreakRequest' }
      responses:
        '200': { description: Updated on default contest participant }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    contest_id:
      name: contest_id
      in: path
      required: true
      schema: { type: integer }
      description: Contest primary key. All contest data scoped by this id.

  responses:
    Unauthorized: { description: Missing/invalid token }
    Forbidden: { description: Role not permitted (RBAC) }
    NotFound: { description: Resource not found }
    ValidationError: { description: Pydantic validation error }
    ContestLocked: { description: contests.is_locked — no structural/rule changes allowed }
    GracePeriodActive: { description: Delete grace period not yet elapsed since pause }
    PasswordSetupRequired:
      description: >-
        Login with temp password blocked when enforce_password_setup=true.
        User must complete /auth/setup via signed link first.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
              code: { type: string, enum: [PASSWORD_SETUP_REQUIRED] }

  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        is_temp_password: { type: boolean }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string }
    CompleteSetupRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: Signed JWT from setup_url query param }
        new_password: { type: string, nullable: true, description: Required when enforce_password_setup=true }
    CompleteSetupResponse:
      type: object
      properties:
        success: { type: boolean, default: true }
        accepted: { type: boolean, default: false }
        already_completed: { type: boolean, default: false }
    SetupPreviewResponse:
      type: object
      properties:
        login: { type: string }
        mode: { type: string, enum: [password_form, confirm_only] }
        already_completed: { type: boolean }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetResponse:
      type: object
      properties:
        message: { type: string }
    ContestRestoreResponse:
      type: object
      properties:
        restored: { type: boolean, default: true }
    UserOut:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        role: { type: string, enum: [SUPERVISOR, SUPPORT, USER], description: 'SUPPORT = technical support staff' }
        first_name: { type: string }
        last_name: { type: string }
        is_temp_password: { type: boolean }
    ContactOut:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        vk_id: { type: string, nullable: true }
        tg_id: { type: string, nullable: true }
        notify_enabled: { type: boolean, default: false }
    ContactPatchRequest:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        vk_id: { type: string, maxLength: 255, nullable: true }
        tg_id: { type: string, maxLength: 255, nullable: true }
        notify_enabled: { type: boolean, nullable: true }
    UserContestOut:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/ContestStatus' }
        participant_status: { type: string, enum: [PENDING, ACCEPTED] }
        role: { type: string, enum: [USER, SUPERVISOR, SUPPORT], description: 'SUPPORT = technical support staff' }
        slug: { type: string, nullable: true }
    PublicContestOut:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/ContestStatus' }
        slug: { type: string, nullable: true }
    CreateSupervisorRequest:
      type: object
      required: [login, password, first_name, last_name]
      properties:
        login: { type: string }
        password: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        is_temp_password: { type: boolean, default: false }
    CreateSupervisorResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserOut' }
    ContestStatus:
      type: string
      enum: [DRAFT, RUNNING, PAUSED, FINISHED]
    ContestOut:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string, nullable: true }
        is_locked: { type: boolean }
        status: { $ref: '#/components/schemas/ContestStatus' }
        paused_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        total_teams: { type: integer }
        matches_per_round: { type: integer }
        total_rounds: { type: integer }
        is_round_robin: { type: boolean }
        rules_json: { type: object }
    CreateContestRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string, nullable: true }
        rules_json: { type: object, description: 'Defaults from contest_defaults.json if omitted' }
        total_teams: { type: integer }
        matches_per_round: { type: integer }
        total_rounds: { type: integer }
        is_round_robin: { type: boolean }
    ContestPatchRequest:
      type: object
      description: Partial update. Rejected with 403 when is_locked=true.
      properties:
        name: { type: string }
        total_teams: { type: integer }
        matches_per_round: { type: integer }
        total_rounds: { type: integer }
        is_round_robin: { type: boolean }
        rules_json: { type: object }
    ContestLifecycleOut:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ContestStatus' }
        paused_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        deletable_at: { type: string, format: date-time, nullable: true }
        seconds_until_deletable: { type: integer, nullable: true }
    ContestDeleteConfirmRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, enum: [DELETE] }
    TeamOut:
      type: object
      properties:
        id: { type: integer }
        contest_id: { type: integer }
        name: { type: string }
        short_name: { type: string }
        logo_url:
          type: string
          description: >-
            Never null in API responses — default static URL when unset in DB.
    LogoUploadResponse:
      type: object
      required: [logo_url]
      properties:
        logo_url: { type: string }
    TeamCreateRequest:
      type: object
      required: [name, short_name]
      properties:
        name: { type: string }
        short_name: { type: string }
        logo_url: { type: string, nullable: true }
    TeamPatchRequest:
      type: object
      properties:
        name: { type: string }
        short_name: { type: string }
        logo_url: { type: string, nullable: true }
    ParticipantOut:
      type: object
      properties:
        user_id: { type: integer }
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACCEPTED] }
        exceptional_tiebreak_points: { type: integer }
    ParticipantCreateRequest:
      type: object
      required: [email, first_name, last_name]
      properties:
        email: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        login: { type: string, description: 'Auto-generated from email if omitted' }
    ParticipantInviteOut:
      type: object
      properties:
        user_id: { type: integer }
        login: { type: string }
        temp_password: { type: string, description: 'Always returned; login blocked when enforce_password_setup=true — use setup_url' }
        status: { type: string, enum: [PENDING, ACCEPTED] }
        setup_url: { type: string, description: '{FRONTEND_BASE_URL}/auth/setup?token=…' }
    ExceptionalTiebreakRequest:
      type: object
      required: [points]
      properties:
        points: { type: integer, minimum: 0 }
    FreeTourRequest:
      type: object
      required: [deadline, matches]
      properties:
        deadline: { type: string, format: date-time }
        matches:
          type: array
          items:
            type: object
            required: [match_id, new_date_time]
            properties:
              match_id: { type: integer }
              new_date_time: { type: string, format: date-time }
    RoundOut:
      type: object
      properties:
        id: { type: integer }
        contest_id: { type: integer }
        number: { type: integer }
        deadline: { type: string, format: date-time }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED, CALCULATED, PUBLISHED] }
        matches_count: { type: integer }
    PredictionItem:
      type: object
      required: [match_id, score1, score2]
      properties:
        match_id: { type: integer }
        score1: { type: integer, minimum: 0 }
        score2: { type: integer, minimum: 0 }
    PredictionBatchRequest:
      type: object
      required: [predictions]
      properties:
        predictions:
          type: array
          items: { $ref: '#/components/schemas/PredictionItem' }
    RoundPredictionsView:
      type: object
      properties:
        round_id: { type: integer }
        deadline_passed: { type: boolean }
        matches: { type: array, items: { $ref: '#/components/schemas/MatchOut' } }
        entries: { type: array, items: { type: object } }
    MatchOut:
      type: object
      properties:
        id: { type: integer }
        team1: { type: string, description: Full team name }
        team2: { type: string, description: Full team name }
        team1_short: { type: string, description: Configured abbreviation (≤4 chars) }
        team2_short: { type: string, description: Configured abbreviation (≤4 chars) }
        date_time: { type: string, format: date-time }
        score1: { type: integer, nullable: true }
        score2: { type: integer, nullable: true }
        status: { type: string, enum: [SCHEDULED, POSTPONED, CANCELED, VOID, FINISHED] }
    CreateRoundRequest:
      type: object
      required: [number, deadline, matches]
      properties:
        number: { type: integer }
        deadline: { type: string, format: date-time }
        matches:
          type: array
          items:
            type: object
            required: [team1_id, team2_id, date_time]
            properties:
              team1_id: { type: integer }
              team2_id: { type: integer }
              date_time: { type: string, format: date-time }
    UpdateRoundRequest:
      type: object
      properties:
        deadline: { type: string, format: date-time }
        matches: { type: array, items: { type: object } }
    MatchResultRequest:
      type: object
      required: [score1, score2]
      properties:
        score1: { type: integer, minimum: 0 }
        score2: { type: integer, minimum: 0 }
        status: { type: string, enum: [FINISHED] }
    ScoreDetail:
      type: object
      properties:
        user_id: { type: integer }
        user_name: { type: string }
        points_base: { type: integer }
        bonus1: { type: integer }
        bonus2: { type: integer }
        bonus3: { type: integer }
        total_without_bonus3: { type: integer, description: Base + bonus1 + bonus2 }
        total_bonus_points: { type: integer, description: Sum of bonus1 + bonus2 + bonus3 }
        total_with_bonus3: { type: integer, description: Grand total including all bonuses }
        correct_outcomes: { type: integer }
        count_exact_high: { type: integer, minimum: 0 }
        count_exact: { type: integer, minimum: 0 }
        count_diff: { type: integer, minimum: 0 }
        count_outcome: { type: integer, minimum: 0 }
    Leaderboard:
      type: object
      properties:
        contest_id: { type: integer }
        round_id: { type: integer, nullable: true }
        round_number: { type: integer, nullable: true }
        bonuses_pending:
          type: boolean
          description: >
            True while Bonus 2/3 for the logical tour are not final (postponed matches
            still SCHEDULED or POSTPONED). Base points may already be present.
        bonuses_pending_message:
          type: string
          nullable: true
          description: Human-readable note when bonuses_pending is true
        leaderboard:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/ScoreDetail' }
              - type: object
                properties:
                  rank: { type: integer }
                  predictions_count: { type: integer }
                  exceptional_tiebreak_points: { type: integer }
                  tiebreaker_status: { type: string, nullable: true, enum: [null, manual_override] }
    RoundResults:
      type: object
      properties:
        round_id: { type: integer }
        matches: { type: array, items: { $ref: '#/components/schemas/MatchOut' } }
        results:
          type: array
          items: { $ref: '#/components/schemas/RoundResultRow' }
    MatchPoints:
      type: object
      required: [match_id, base_points]
      properties:
        match_id: { type: integer }
        base_points:
          type: integer
          nullable: true
          description: Base match points (0, 4, 8, 12, 16); null if no prediction or match not scorable
    RoundResultRow:
      type: object
      required:
        - user_id
        - user_name
        - points
        - bonus1
        - bonus2
        - total_without_bonus3
        - total
        - correct_outcomes
      properties:
        user_id: { type: integer }
        user_name: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/MatchPoints' }
          description: One entry per matches[] item, same order; base_points only (no bonus1 per cell)
        bonus1: { type: integer }
        bonus2: { type: integer }
        bonus3: { type: integer, nullable: true }
        total_without_bonus3: { type: integer, description: Base + bonus1 + bonus2 (Итого без бон.) }
        total: { type: integer, description: total_with_bonus3 including bonus3 }
        correct_outcomes: { type: integer }
