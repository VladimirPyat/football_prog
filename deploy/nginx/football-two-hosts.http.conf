# Football Predictions Contest — два поддомена (HTTP, без TLS)
#
# Схема:
#   http://app.YOUR_DOMAIN/  → Next.js (127.0.0.1:3000)
#   http://api.YOUR_DOMAIN/  → FastAPI (127.0.0.1:8000)
#
# .env:
#   PUBLIC_FRONTEND_URL=http://app.YOUR_DOMAIN
#   PUBLIC_API_URL=http://api.YOUR_DOMAIN
#
# Для стейджинга без DNS добавьте в /etc/hosts на клиенте:
#   YOUR_SERVER_IP app.YOUR_DOMAIN api.YOUR_DOMAIN
#
# Установка: manuals/setup/DEPLOYMENT.md § nginx

upstream football_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream football_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.YOUR_DOMAIN;

    client_max_body_size 4m;

    location / {
        proxy_pass http://football_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.YOUR_DOMAIN;

    client_max_body_size 4m;

    location / {
        proxy_pass http://football_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
