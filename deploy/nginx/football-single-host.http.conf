# Football Predictions Contest — один публичный хост (HTTP, без TLS)
#
# Схема:
#   http://YOUR_PUBLIC_HOST/        → Next.js (127.0.0.1:3000)
#   http://YOUR_PUBLIC_HOST/api/    → FastAPI (127.0.0.1:8000)
#   http://YOUR_PUBLIC_HOST/static/ → FastAPI (логотипы)
#   http://YOUR_PUBLIC_HOST/health  → FastAPI
#
# .env (оба URL одинаковые, без порта):
#   PUBLIC_FRONTEND_URL=http://YOUR_PUBLIC_HOST
#   PUBLIC_API_URL=http://YOUR_PUBLIC_HOST
#
# Установка: manuals/setup/DEPLOYMENT.md § nginx

upstream football_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream football_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_PUBLIC_HOST;

    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://football_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /static/ {
        proxy_pass http://football_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://football_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://football_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
